<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Neon Dodge</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #07071a;
      color: #fff;
      font-family: system-ui, sans-serif;
    }
    canvas {
      width: min(92vw, 480px);
      height: min(92vh, 720px);
      border: 2px solid #40d9ff;
      border-radius: 12px;
      box-shadow: 0 0 30px #40d9ff55;
      background: #0b0b24;
    }
  </style>
</head>
<body>
  <canvas id="game" width="480" height="720"></canvas>
  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const lanes = [120, 240, 360];
    let lane = 1;
    let objects = [];
    let particles = [];
    let score = 0;
    let energy = 100;
    let running = false;
    let gameOver = false;
    let lastTime = 0;
    let spawnTimer = 0;

    const player = { x: lanes[lane], y: 620, size: 24 };

    function move(direction) {
      if (!running || gameOver) return;
      lane = Math.max(0, Math.min(lanes.length - 1, lane + direction));
    }

    function spawnObject() {
      const laneIndex = Math.floor(Math.random() * lanes.length);
      const isShard = Math.random() < 0.3;
      objects.push({
        x: lanes[laneIndex], y: -40,
        size: isShard ? 13 : 25,
        speed: 230 + score * 2,
        type: isShard ? "shard" : "obstacle"
      });
    }

    function burst(x, y, color) {
      for (let i = 0; i < 12; i++) {
        particles.push({
          x, y,
          vx: (Math.random() - 0.5) * 180,
          vy: (Math.random() - 0.5) * 180,
          life: 0.6,
          color
        });
      }
    }

    function reset() {
      lane = 1;
      player.x = lanes[lane];
      objects = [];
      particles = [];
      score = 0;
      energy = 100;
      spawnTimer = 0;
      running = true;
      gameOver = false;
      lastTime = performance.now();
      requestAnimationFrame(loop);
    }

    function update(delta) {
      player.x += (lanes[lane] - player.x) * Math.min(1, delta * 12);
      spawnTimer -= delta;

      if (spawnTimer <= 0) {
        spawnObject();
        spawnTimer = Math.max(0.35, 0.85 - score / 500);
      }

      for (let i = objects.length - 1; i >= 0; i--) {
        const object = objects[i];
        object.y += object.speed * delta;

        const dx = player.x - object.x;
        const dy = player.y - object.y;

        if (Math.hypot(dx, dy) < player.size + object.size) {
          if (object.type === "shard") {
            score += 25;
            energy = Math.min(100, energy + 8);
            burst(object.x, object.y, "#ffe45c");
          } else {
            energy -= 34;
            burst(object.x, object.y, "#ff3b81");
          }
          objects.splice(i, 1);
          continue;
        }

        if (object.y > canvas.height + 40) {
          if (object.type === "obstacle") score += 5;
          objects.splice(i, 1);
        }
      }

      if (energy <= 0) {
        energy = 0;
        running = false;
        gameOver = true;
      }

      score += delta * 2;

      for (let i = particles.length - 1; i >= 0; i--) {
        const particle = particles[i];
        particle.x += particle.vx * delta;
        particle.y += particle.vy * delta;
        particle.life -= delta;
        if (particle.life <= 0) particles.splice(i, 1);
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#0b0b24";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = "#16164b";
      ctx.lineWidth = 2;
      for (const laneX of lanes) {
        ctx.beginPath();
        ctx.moveTo(laneX, 0);
        ctx.lineTo(laneX, canvas.height);
        ctx.stroke();
      }

      ctx.save();
      ctx.translate(player.x, player.y);
      ctx.shadowBlur = 20;
      ctx.shadowColor = "#40d9ff";
      ctx.fillStyle = "#40d9ff";
      ctx.beginPath();
      ctx.moveTo(0, -28);
      ctx.lineTo(24, 22);
      ctx.lineTo(0, 14);
      ctx.lineTo(-24, 22);
      ctx.closePath();
      ctx.fill();
      ctx.restore();

      for (const object of objects) {
        ctx.save();
        ctx.translate(object.x, object.y);
        if (object.type === "shard") {
          ctx.shadowBlur = 18;
          ctx.shadowColor = "#ffe45c";
          ctx.fillStyle = "#ffe45c";
          ctx.rotate(Math.PI / 4);
          ctx.fillRect(-10, -10, 20, 20);
        } else {
          ctx.shadowBlur = 18;
          ctx.shadowColor = "#ff3b81";
          ctx.fillStyle = "#ff3b81";
          ctx.fillRect(-25, -25, 50, 50);
        }
        ctx.restore();
      }

      for (const particle of particles) {
        ctx.globalAlpha = Math.max(0, particle.life * 2);
        ctx.fillStyle = particle.color;
        ctx.fillRect(particle.x, particle.y, 4, 4);
      }
      ctx.globalAlpha = 1;

      ctx.fillStyle = "#fff";
      ctx.font = "24px system-ui";
      ctx.fillText(`Score: ${Math.floor(score)}`, 20, 38);

      ctx.fillStyle = "#333366";
      ctx.fillRect(300, 18, 160, 18);
      ctx.fillStyle = energy > 35 ? "#40d9ff" : "#ff3b81";
      ctx.fillRect(300, 18, 160 * energy / 100, 18);

      if (!running && !gameOver) {
        ctx.fillStyle = "rgba(7, 7, 26, 0.82)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#fff";
        ctx.textAlign = "center";
        ctx.font = "48px system-ui";
        ctx.fillText("NEON DODGE", 240, 300);
        ctx.font = "22px system-ui";
        ctx.fillText("Press Enter or tap to start", 240, 350);
        ctx.textAlign = "start";
      }

      if (gameOver) {
        ctx.fillStyle = "rgba(7, 7, 26, 0.82)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#fff";
        ctx.textAlign = "center";
        ctx.font = "48px system-ui";
        ctx.fillText("GAME OVER", 240, 300);
        ctx.font = "26px system-ui";
        ctx.fillText(`Score: ${Math.floor(score)}`, 240, 350);
        ctx.font = "22px system-ui";
        ctx.fillText("Press Enter or tap to retry", 240, 395);
        ctx.textAlign = "start";
      }
    }

    function loop(time) {
      if (!running) {
        draw();
        return;
      }
      const delta = Math.min((time - lastTime) / 1000, 0.05);
      lastTime = time;
      update(delta);
      draw();
      requestAnimationFrame(loop);
    }

    function handleAction() {
      if (!running) reset();
    }

    window.addEventListener("keydown", event => {
      if (event.key === "ArrowLeft" || event.key.toLowerCase() === "a") move(-1);
      if (event.key === "ArrowRight" || event.key.toLowerCase() === "d") move(1);
      if (event.key === "Enter" || event.key === " ") handleAction();
    });

    canvas.addEventListener("pointerdown", event => {
      if (!running) {
        handleAction();
        return;
      }
      const bounds = canvas.getBoundingClientRect();
      const x = event.clientX - bounds.left;
      move(x < canvas.width / 2 ? -1 : 1);
    });

    draw();
  </script>
</body>
</html>
